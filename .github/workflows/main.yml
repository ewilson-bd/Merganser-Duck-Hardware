name: Local-Bridge
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
   
jobs:
  build:
    runs-on: [ubuntu-latest]
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
    - name: Set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: maven
    - name: Prepare Maven
      run: mvn spotless:apply && mvn -N wrapper:wrapper && chmod +x ./mvnw
    - name: Install Bridge
      run: |
        curl -fLsS -o bridge.zip https://repo.blackduck.com/bds-integrations-release/com/blackduck/integration/bridge/binaries/bridge-cli-bundle/latest/bridge-cli-bundle-linux64.zip && unzip -qo -d ${{runner.temp}} bridge.zip && rm -f bridge.zip
    - name: Run Bridge
      env:
        POLARIS_ACCESS_TOKEN: ${{ secrets.POLARIS_ACCESS_TOKEN }}
      run: |
        ${{runner.temp}}/bridge-cli-bundle-linux64/bridge-cli --stage polaris polaris.project.name="Jama Project" 
        polaris.application.name="Jama Application" polaris.assessment.types="SCA" 
        polaris.accessToken="$POLARIS_ACCESS_TOKEN"
        polaris.test.sca.type="SCA_BINARY" polaris.artifactToUpload="binaryFile.bin"
        

